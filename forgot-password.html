<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Employee Task Manager</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/forgot-password.css">
</head>
<body>

    <main class="forgot-container">

        <!-- Header with built-in vector lock icon -->
        <header class="forgot-header">
            <div class="logo-icon-wrapper">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <h1 id="pageTitle">Reset Password</h1>
            <p id="pageSubtitle">Enter your work email and we'll help you reset your password.</p>
        </header>

        <!-- STEP 1: Enter Email -->
        <form id="requestResetForm" novalidate>
            <div class="form-group">
                <label for="resetEmail">Work Email</label>
                <input type="email" id="resetEmail" name="resetEmail" placeholder="e.g. name@company.com" required>
                <span class="error-message" id="emailError"></span>
            </div>

            <button type="submit" class="btn-primary" id="sendCodeBtn">Verify Email</button>
        </form>

        <!-- STEP 2: Set New Password (Hidden by default, revealed once email is verified) -->
        <form id="newPasswordForm" class="hidden" novalidate>
            <div class="alert-banner" id="userVerifiedBanner">
                Verified account for: <strong id="verifiedEmailText">user@company.com</strong>
            </div>

            <!-- New Password -->
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="newPassword" placeholder="Enter new password" required>
                    <button type="button" class="toggle-password" data-target="newPassword">Show</button>
                </div>
                <div class="strength-meter-wrapper">
                    <div class="strength-meter-bar" id="strengthBar"></div>
                </div>
                <div class="strength-meter-text" id="strengthText">Password strength</div>
                <span class="error-message" id="newPasswordError"></span>
            </div>

            <!-- Confirm New Password -->
            <div class="form-group">
                <label for="confirmNewPassword">Confirm New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmNewPassword" placeholder="Re-enter new password" required>
                    <button type="button" class="toggle-password" data-target="confirmNewPassword">Show</button>
                </div>
                <span class="error-message" id="confirmPasswordError"></span>
            </div>

            <button type="submit" class="btn-primary" id="updatePasswordBtn">Update Password</button>
        </form>

        <!-- SUCCESS STATE (Shown after successful update) -->
        <div id="successState" class="hidden success-state">
            <div class="success-icon">✓</div>
            <h3>Password Reset Complete</h3>
            <p>Your password has been securely updated. You can now sign in with your new credentials.</p>
            <a href="login.html" class="btn-primary" style="display: block; text-align: center; text-decoration: none; margin-top: 1.5rem;">Proceed to Sign In</a>
        </div>

        <!-- Back to Login Navigation -->
        <div class="forgot-footer" id="footerNav">
            <a href="login.html" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back to Sign In
            </a>
        </div>

    </main>

    <script src="js/forgot-password.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
