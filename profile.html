<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Employee Task Manager</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        function checkAuthGuard() {
            var token = localStorage.getItem('etm_access_token');
            var user = localStorage.getItem('etm_current_user');
            if (!token || !user) {
                document.documentElement.innerHTML = '';
                window.location.replace('login.html');
            }
        }
        checkAuthGuard();
        window.addEventListener('pageshow', function (event) {
            checkAuthGuard();
        });
        function logoutUser(e) {
            if (e && e.preventDefault) e.preventDefault();
            localStorage.clear();
            sessionStorage.clear();
            document.documentElement.innerHTML = '';
            window.location.replace('login.html');
        }
    </script>
    <script>
        (function() {
            var theme = localStorage.getItem('etm_theme') || 'light';
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-theme');
            }
            var lastToggleTime = 0;
            window.toggleDarkMode = function(e) {
                if (e && e.preventDefault) e.preventDefault();
                var now = Date.now();
                if (now - lastToggleTime < 350) return;
                lastToggleTime = now;

                var isDark = document.documentElement.classList.contains('dark-theme');
                var next = isDark ? 'light' : 'dark';
                if (next === 'dark') {
                    document.documentElement.classList.add('dark-theme');
                } else {
                    document.documentElement.classList.remove('dark-theme');
                }
                try { localStorage.setItem('etm_theme', next); } catch (_) {}
                var btns = document.querySelectorAll('#themeToggleBtn, .theme-toggle-btn');
                btns.forEach(function(b) {
                    b.innerHTML = (next === 'dark') ? '☀️' : '🌙';
                    b.setAttribute('title', (next === 'dark') ? 'Switch to Light Mode' : 'Switch to Dark Mode');
                });
            };
            document.addEventListener('DOMContentLoaded', function() {
                var isDark = document.documentElement.classList.contains('dark-theme');
                var btns = document.querySelectorAll('#themeToggleBtn, .theme-toggle-btn');
                btns.forEach(function(b) {
                    b.innerHTML = isDark ? '☀️' : '🌙';
                    b.setAttribute('title', isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode');
                });
            });
        })();
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/notifications.css?v=1.0">
    <link rel="stylesheet" href="css/theme.css?v=1.3">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <header class="navbar">
        <div class="navbar-brand">
            <img src="images/logo.png" alt="Logo" class="logo-small">
            <span>Task Manager</span>
        </div>
        <nav class="navbar-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="tasks.html">Tasks</a>
            <a href="profile.html" class="active">Profile</a>
            <button type="button" class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleDarkMode()" aria-label="Toggle Theme" title="Toggle Dark/Light Mode">🌙</button>
            <a href="login.html" onclick="logoutUser(event)">Logout</a>
        </nav>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">&#9776;</button>
    </header>

    <div class="layout">

        <aside class="sidebar" id="sidebar">
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="tasks.html">My Tasks</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
                <li><a href="login.html" onclick="logoutUser(event)">Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">

            <h1>My Profile</h1>

            <section class="profile-card">
                <img src="images/profile.png" alt="Profile Picture" class="profile-picture" id="profilePicture">

                <dl class="profile-details">
                    <dt>Name</dt>
                    <dd id="profileName">—</dd>

                    <dt>Email</dt>
                    <dd id="profileEmail">—</dd>

                    <dt>Department</dt>
                    <dd id="profileDepartment">—</dd>

                    <dt>Role</dt>
                    <dd id="profileRole">—</dd>

                    <dt>Total Completed Tasks</dt>
                    <dd id="profileCompletedCount">0</dd>
                </dl>

                <button class="btn btn-secondary" id="editProfileBtn">Edit Profile</button>
            </section>

        </main>

    </div>

    <script src="js/api.js?v=2.2"></script>
    <script src="js/storage.js?v=2.2"></script>
    <script src="js/nav.js?v=2.2"></script>
    <script src="js/role-ui.js?v=1.1"></script>
    <script src="js/theme.js?v=1.3"></script>
    <script src="js/profile.js?v=2.2"></script>
    <script src="js/notifications.js?v=1.0"></script>
</body>
</html>
