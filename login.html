<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Employee Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main class="login-page">
        <section class="login-container">

            <header class="login-header">
                <!-- Clean vector icon (never shows broken image) -->
                <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #4F46E5, #6366F1); color: #fff; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                        <path d="m9 14 2 2 4-4"></path>
                    </svg>
                </div>
                <h1>Employee Task Manager</h1>
                <p>Sign in to manage your tasks</p>
            </header>

            <form id="loginForm" action="#" method="post" novalidate>

                <!-- Username -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    <span class="error-message" id="usernameError"></span>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" id="togglePassword" class="toggle-password">Show</button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="form-group form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        Remember me
                    </label>
                    <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary">Login</button>

                <!-- Create Account Link -->
                <p style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #6b7280;">
                    Don't have an account? <a href="register.html" style="color: #4F46E5; font-weight: 600; text-decoration: none;">Create Account</a>
                </p>

                <p class="login-footer-text">
                    Employee/Admin login only. Contact IT support for account issues.
                </p>

            </form>

        </section>
    </main>

    <script src="js/login.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
