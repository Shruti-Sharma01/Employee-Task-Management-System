<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Employee Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <header class="navbar">
        <div class="navbar-brand">
            <img src="images/logo.png" alt="Logo" class="logo-small">
            <span>Task Manager</span>
        </div>
        <nav class="navbar-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="tasks.html" class="active">Tasks</a>
            <a href="profile.html">Profile</a>
            <a href="login.html">Logout</a>
        </nav>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">&#9776;</button>
    </header>

    <div class="layout">

        <aside class="sidebar" id="sidebar">
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="tasks.html" class="active">My Tasks</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </aside>

        <main class="main-content">

            <h1>Task Management</h1>

            <button class="btn btn-primary" id="openAddTaskBtn">+ Add Task</button>

            <!-- Search & Filter -->
            <section class="search-filter-bar">
                <div class="form-group">
                    <label for="searchInput">Search</label>
                    <input type="text" id="searchInput" placeholder="Search by task name">
                </div>

                <div class="form-group">
                    <label for="statusFilter">Status</label>
                    <select id="statusFilter">
                        <option value="all">All</option>
                        <option value="pending">Pending</option>
                        <option value="in-progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="priorityFilter">Priority</label>
                    <select id="priorityFilter">
                        <option value="all">All</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="categoryFilter">Category</label>
                    <select id="categoryFilter">
                        <option value="all">All</option>
                        <option value="development">Development</option>
                        <option value="testing">Testing</option>
                        <option value="documentation">Documentation</option>
                        <option value="design">Design</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="sortBy">Sort by Deadline</label>
                    <select id="sortBy">
                        <option value="asc">Earliest First</option>
                        <option value="desc">Latest First</option>
                    </select>
                </div>
            </section>

            <!-- Add / Edit Task Form -->
            <section class="task-form-container" id="taskFormContainer" hidden>
                <!-- Added missing heading below -->
                <h2 id="formHeading">Add New Task</h2>
                <form id="taskForm" novalidate>
                    <input type="hidden" id="taskId" name="taskId">

                    <div class="form-group">
                        <label for="taskTitle">Task Title *</label>
                        <input type="text" id="taskTitle" name="taskTitle" required>
                        <span class="error-message" id="taskTitleError"></span>
                    </div>

                    <div class="form-group">
                        <label for="taskDescription">Description</label>
                        <textarea id="taskDescription" name="taskDescription" rows="3"></textarea>
                        <span class="error-message" id="taskDescriptionError"></span>
                    </div>

                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority" name="taskPriority">
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskCategory">Category</label>
                        <select id="taskCategory" name="taskCategory">
                            <option value="development">Development</option>
                            <option value="testing">Testing</option>
                            <option value="documentation">Documentation</option>
                            <option value="design">Design</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskDueDate">Due Date *</label>
                        <input type="date" id="taskDueDate" name="taskDueDate" required>
                        <span class="error-message" id="taskDueDateError"></span>
                    </div>

                    <div class="form-group">
                        <label for="taskStatus">Status</label>
                        <select id="taskStatus" name="taskStatus">
                            <option value="pending">Pending</option>
                            <option value="in-progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Task</button>
                        <button type="button" class="btn btn-secondary" id="cancelTaskBtn">Cancel</button>
                    </div>
                </form>
            </section>

            <!-- Task List -->
            <section class="task-list-container">
                <table class="tasks-table" id="tasksTable">
                    <thead>
                        <tr>
                            <th>Task Title</th>
                            <th>Category</th>
                            <th>Priority</th>
                            <th>Due Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tasksTableBody">
                        <!-- Rows inserted dynamically via JavaScript -->
                    </tbody>
                </table>
            </section>

            <!-- Delete Confirmation Modal -->
            <div class="modal" id="deleteModal" hidden>
                <div class="modal-content">
                    <h3>Delete Task?</h3>
                    <p>Are you sure you want to delete this task? This action cannot be undone.</p>
                    <div class="modal-actions">
                        <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
                        <button class="btn btn-secondary" id="cancelDeleteBtn">Cancel</button>
                    </div>
                </div>
            </div>

        </main>

    </div>

    <script src="js/storage.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/tasks.js"></script>
</body>
</html>
