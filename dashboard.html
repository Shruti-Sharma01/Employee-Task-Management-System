<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Employee Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <header class="navbar">
        <div class="navbar-brand">
            <img src="images/logo.png" alt="Logo" class="logo-small">
            <span>Task Manager</span>
        </div>
        <nav class="navbar-links">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="tasks.html">Tasks</a>
            <a href="profile.html">Profile</a>
            <a href="login.html">Logout</a>
        </nav>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">&#9776;</button>
    </header>

    <div class="layout">

        <aside class="sidebar" id="sidebar">
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="tasks.html">My Tasks</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </aside>

        <main class="main-content">

            <h1>Employee Dashboard</h1>

            <section class="stats-cards">
                <div class="card" id="totalTasksCard">
                    <h3>Total Tasks</h3>
                    <p class="stat-number" id="totalTasks">0</p>
                </div>
                <div class="card" id="pendingTasksCard">
                    <h3>Pending</h3>
                    <p class="stat-number" id="pendingTasks">0</p>
                </div>
                <div class="card" id="progressTasksCard">
                    <h3>In Progress</h3>
                    <p class="stat-number" id="progressTasks">0</p>
                </div>
                <div class="card" id="completedTasksCard">
                    <h3>Completed</h3>
                    <p class="stat-number" id="completedTasks">0</p>
                </div>
            </section>

            <section class="progress-section">
                <h2>Overall Progress</h2>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
                </div>
                <p id="progressPercent">0% completed</p>
            </section>

            <section class="recent-tasks">
                <h2>Recent Tasks</h2>
                <table class="tasks-table" id="recentTasksTable">
                    <thead>
                        <tr>
                            <th>Task</th>
                            <th>Priority</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="recentTasksBody">
                        <!-- Rows inserted dynamically via JavaScript on Day 5/8 -->
                    </tbody>
                </table>
            </section>

        </main>

    </div>

    <script src="js/storage.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
