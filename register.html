<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Employee Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <main class="register-container">

        <!-- Modern Header with Built-in SVG Icon (Never Breaks) -->
        <header class="register-header">
            <div class="logo-icon-wrapper">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                    <path d="m9 14 2 2 4-4"></path>
                </svg>
            </div>
            <h1>Create an Account</h1>
            <p>Join Employee Task Manager</p>
        </header>

        <form id="registerForm" novalidate>

            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your Name" required>
                <span class="error-message" id="fullNameError"></span>
            </div>

            <!-- Work Email -->
            <div class="form-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" placeholder="Enter your Email Address" required>
                <span class="error-message" id="emailError"></span>
            </div>

            <!-- 2-Column: Username & Department -->
            <div class="form-row">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required>
                    <span class="field-hint" id="usernameHint">3–20 alphanumeric chars</span>
                    <span class="error-message" id="usernameError"></span>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department" required>
                        <option value="" disabled selected>Select department</option>
                        <option value="engineering">Engineering</option>
                        <option value="design">Product & Design</option>
                        <option value="marketing">Marketing</option>
                        <option value="sales">Sales & Support</option>
                        <option value="hr">Human Resources</option>
                        <option value="management">Management</option>
                    </select>
                    <span class="error-message" id="departmentError"></span>
                </div>
            </div>

            <!-- Password with Real-time Strength & Rules -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Create a strong password" required>
                    <button type="button" class="toggle-password" data-target="password">Show</button>
                </div>

                <!-- Strength Bar & Status -->
                <div class="strength-meter-wrapper">
                    <div class="strength-meter-bar" id="strengthBar"></div>
                </div>
                <div class="strength-meter-text" id="strengthText">Password strength</div>

                <!-- Live Rule Checklist -->
                <ul class="field-rules" id="passwordRules">
                    <li class="rule-item" id="rule-length">At least 8 characters</li>
                    <li class="rule-item" id="rule-uppercase">At least 1 uppercase letter (A–Z)</li>
                    <li class="rule-item" id="rule-number">At least 1 number (0–9)</li>
                    <li class="rule-item" id="rule-special">At least 1 special character (!@#$%^&*)</li>
                </ul>

                <span class="error-message" id="passwordError"></span>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                    <button type="button" class="toggle-password" data-target="confirmPassword">Show</button>
                </div>
                <span class="field-hint" id="matchHint">Must match password</span>
                <span class="error-message" id="confirmPasswordError"></span>
            </div>

            <!-- Terms Checkbox -->
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="agreeTerms">
                    <span>I agree to the <a href="#" class="inline-link">Workspace Terms</a> & <a href="#" class="inline-link">Privacy Policy</a></span>
                </label>
                <span class="error-message" id="termsError"></span>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Create Account</button>

            <p class="login-footer-text">
                Already have an account? <a href="login.html" class="inline-link">Sign In</a>
            </p>

        </form>

    </main>

    <!-- Interactive JavaScript with Password Strength and LocalStorage -->
    <script src="js/register.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
